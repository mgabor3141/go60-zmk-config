name: Build

on: [push, pull_request, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: docker.io/zmkfirmware/zmk-build-arm:4.1
    steps:
      - uses: actions/checkout@v5
        with:
          path: config
      - name: Clone pinned ZMK fork revision
        run: |
          git init -q /zmk
          git -C /zmk remote add origin https://github.com/mgabor3141/zmk.git
          git -C /zmk fetch origin 5b071c50500ecbf45545516789160e21c83ce190 --depth 5
          git -C /zmk checkout -q FETCH_HEAD
      - name: Initialize west workspace
        working-directory: /zmk
        run: west init -l app
      - name: Update modules
        working-directory: /zmk
        run: west update --fetch-opt=--filter=tree:0
      - name: Export Zephyr CMake package
        working-directory: /zmk
        run: west zephyr-export
      - name: Prepare Pinnacle sources
        run: $GITHUB_WORKSPACE/config/scripts/prepare-west-tree.sh /zmk
      - name: Build LH
        working-directory: /zmk
        run: >
          west build -p -s app -b go60_lh -d /build/go60_lh --
          -DKEYMAP_FILE=$GITHUB_WORKSPACE/config/config/go60.keymap
          -DEXTRA_CONF_FILE=$GITHUB_WORKSPACE/config/config/go60.conf
      - name: Build RH
        working-directory: /zmk
        run: >
          west build -p -s app -b go60_rh -d /build/go60_rh --
          -DKEYMAP_FILE=$GITHUB_WORKSPACE/config/config/go60.keymap
          -DEXTRA_CONF_FILE=$GITHUB_WORKSPACE/config/config/go60.conf
      - name: Combine firmware
        run: cat /build/go60_lh/zephyr/zmk.uf2 /build/go60_rh/zephyr/zmk.uf2 > go60.uf2
      - name: Upload result
        uses: actions/upload-artifact@v4
        with:
          name: go60.uf2
          path: go60.uf2
